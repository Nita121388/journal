<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A · Paper Desk</title>
<style>
  /* ── A. Paper Desk ────────────────────────────────────────────
   * 立场：暖纸底 + 墨线分隔 + 墨块主按钮；绿只作数据色。
   * 参考：Inkra（整页一张纸、无阴影）+ BoardUI（尺寸/信息层级）。
   */
  :root{
    --paper:#F6F2E9; --raised:#FDFBF5; --sunken:#EFEADF;
    --ink:#26241F; --soft:#625D52; --weak:#6B655A;
    --rule:#E0D9C9; --rule2:#CFC6B2;
    --ink-fill:#26241F; --on-ink:#FDFBF5;
    --seal:#B4453A;
    --purple-bg:#F1ECFB; --purple-bd:#C9B9EC; --purple-tx:#553087;
    --blue-bg:#E9F1FB;   --blue-bd:#B6CDEC;   --blue-tx:#1C4F8C;
    --green-bg:#E9F6EC;  --green-bd:#B3DDBD;  --green-tx:#1F6B36;
    --r-4:4px; --r-6:6px; --r-10:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --dur:120ms;
  }
  [data-theme="dark"]{
    --paper:#1B1916; --raised:#23201C; --sunken:#161411;
    --ink:#ECE7DC; --soft:#A39C8E; --weak:#B0A897;
    --rule:#332E27; --rule2:#433D34;
    --ink-fill:#ECE7DC; --on-ink:#1B1916;
    --seal:#E0675A;
    --purple-bg:#2B2440; --purple-bd:#4B3F6B; --purple-tx:#C4AEF5;
    --blue-bg:#1E2C3D;   --blue-bd:#37536F;   --blue-tx:#96C4F5;
    --green-bg:#1F3226;  --green-bd:#3C5F47;  --green-tx:#8FE0A4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font);
    font-size:12.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  /* 纸纹：一层极淡噪点，不拦截事件 */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }
  .app{position:relative; z-index:1; height:100vh; display:flex; flex-direction:column}

  /* ── 通用控件 ── */
  .ib{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; padding:0; border:0; border-radius:var(--r-6);
    background:transparent; color:var(--soft); cursor:pointer;
    transition:background var(--dur) ease-out,color var(--dur) ease-out;
  }
  .ib:hover{background:var(--sunken); color:var(--ink)}
  .ib:active{transform:translateY(.5px)}
  .ib:focus-visible{outline:2px solid var(--seal); outline-offset:1px}
  .ib.xs{width:24px; height:24px}
  .btn{
    display:inline-flex; align-items:center; gap:5px;
    height:28px; padding:0 10px; border-radius:var(--r-6);
    font:inherit; font-size:11.5px; font-weight:500; letter-spacing:.1px;
    cursor:pointer; transition:background var(--dur) ease-out,border-color var(--dur) ease-out;
  }
  .btn.xs{height:24px; padding:0 8px; font-size:11px}
  .btn.solid{background:var(--ink-fill); color:var(--on-ink); border:1px solid var(--ink-fill)}
  .btn.solid:hover{filter:brightness(1.12)}
  .btn.outline{background:var(--raised); color:var(--ink); border:1px solid var(--rule2)}
  .btn.outline:hover{background:var(--sunken)}
  .btn.quiet{background:transparent; color:var(--soft); border:1px solid transparent}
  .btn.quiet:hover{background:var(--sunken); color:var(--ink)}
  .btn:active{transform:translateY(.5px)}

  /* ── Header ── */
  .hdr{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    height:44px; padding:0 12px; border-bottom:1px solid var(--rule); flex:0 0 auto;
  }
  .brand{display:flex; align-items:center; gap:7px; min-width:0}
  .mark{
    width:18px; height:18px; border-radius:4px; background:var(--ink); color:var(--paper);
    display:grid; place-items:center; font-size:11px; font-weight:700; flex:0 0 auto;
  }
  .name{font-size:13px; font-weight:600; letter-spacing:.1px}
  .date{font-size:11.5px; color:var(--weak); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hdr-actions{display:flex; align-items:center; gap:2px; flex:0 0 auto}
  .is-live{color:var(--green-tx)}
  .is-live:hover{color:var(--green-tx)}

  /* ── 视图头（两行） ── */
  .vhead{padding:8px 12px 6px; flex:0 0 auto}
  .vrow{display:flex; align-items:center; gap:4px}
  .vrow + .vrow{margin-top:6px}
  .vtitle{font-size:12.5px; font-weight:600; margin-right:auto; padding-left:2px}
  .vtitle em{font-style:normal; font-weight:400; font-size:11px; color:var(--weak); margin-left:5px}

  /* ── 时间线 ── */
  .tl{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative}
  .track{position:relative; height:900px; padding-bottom:16px; margin-top:10px}
  .hour{position:absolute; left:0; right:0; height:1px; background:var(--rule)}
  .hour span{
    position:absolute; left:0; top:-7px; width:38px; text-align:right;
    font-size:10.5px; color:var(--weak); font-variant-numeric:tabular-nums;
    background:var(--paper); padding-right:6px;
  }
  .hour::after{content:""; position:absolute; left:44px; right:12px; top:0; height:1px; background:var(--rule)}
  .hour span{left:-6px; width:44px}

  .card{
    position:absolute; left:50px; right:12px;
    background:var(--raised); border:1px solid var(--rule2); border-radius:var(--r-10);
    padding:7px 10px 8px 12px; overflow:hidden;
    transition:border-color var(--dur) ease-out;
  }
  .card:hover{border-color:var(--ink-soft,#8A8375)}
  .card::before{
    content:""; position:absolute; left:0; top:9px; bottom:9px; width:2.5px;
    border-radius:0 2px 2px 0; background:var(--cc,#8A8375);
  }
  .card .ttl{font-size:12.5px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card .meta{
    margin-top:2px; font-size:10.5px; color:var(--weak);
    font-variant-numeric:tabular-nums; display:flex; gap:6px;
  }
  .card .meta .dot{opacity:.5}
  .card .note{
    margin-top:3px; font-size:11px; color:var(--soft); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card.c-purple{--cc:var(--purple-tx); background:color-mix(in srgb,var(--purple-bg) 62%,var(--raised))}
  .card.c-blue{--cc:var(--blue-tx); background:color-mix(in srgb,var(--blue-bg) 55%,var(--raised))}
  .card.c-green{--cc:var(--green-tx)}

  /* 胶带（全站限量 1 处） */
  .card.taped::after{
    content:""; position:absolute; top:-7px; left:14px; width:52px; height:14px;
    background:color-mix(in srgb, #fff 62%, transparent);
    border-left:1px solid rgba(120,105,80,.12); border-right:1px solid rgba(120,105,80,.12);
    transform:rotate(-3.5deg); box-shadow:0 1px 1px rgba(60,50,35,.06);
  }
  [data-theme="dark"] .card.taped::after{background:rgba(90,84,72,.5); border-color:rgba(255,255,255,.08)}

  /* 当前时间 */
  .now{position:absolute; left:44px; right:12px; height:2px; background:var(--seal); z-index:2}
  .now::before{
    content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px;
    border-radius:50%; background:var(--seal);
  }
  .now .pill{
    position:absolute; left:6px; top:-9px; height:18px; padding:0 6px; border-radius:4px;
    background:var(--seal); color:#fff; font-size:10px; font-weight:600;
    display:inline-flex; align-items:center; font-variant-numeric:tabular-nums; letter-spacing:.2px;
  }

  /* ── Dock（唯一视图切换入口） ── */
  .dock{
    flex:0 0 auto; display:flex; gap:2px; align-items:center;
    margin:0 10px 10px; padding:3px; height:44px;
    background:color-mix(in srgb,var(--raised) 92%, transparent);
    border:1px solid var(--rule2); border-radius:999px;
    box-shadow:0 2px 10px rgba(60,50,35,.07);
  }
  .dock button{
    flex:1 1 0; min-width:0; display:inline-flex; align-items:center; justify-content:center; gap:5px;
    height:36px; border:0; border-radius:999px; background:transparent;
    font:inherit; font-size:11px; color:var(--soft); cursor:pointer;
  }
  .dock button svg{flex:0 0 auto}
  .dock button.on{background:var(--ink); color:var(--paper); font-weight:600}
  .dock button:not(.on):hover{background:var(--sunken); color:var(--ink)}
  @media (max-width:300px){ .dock button span{display:none} }

  /* 空状态签名（示意放在卡片池抽屉，这里以悬浮提示展示） */
  .hint{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%);
    font-size:10.5px; color:var(--weak); background:var(--sunken);
    border:1px solid var(--rule); border-radius:999px; padding:2px 10px; display:none;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="brand">
      <span class="mark">J</span>
      <span class="name">Journal</span>
      <span class="date">2026年11月8日 周日</span>
    </div>
    <div class="hdr-actions">
      <button class="ib" aria-label="面板"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="ib is-live" aria-label="本机服务已连接"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8.5" opacity=".35"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg></button>
      <button class="ib" aria-label="设置"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg></button>
    </div>
  </header>

  <div class="vhead">
    <div class="vrow">
      <button class="ib xs" aria-label="上一页"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="vtitle">11月8日 周日<em>· 1 条记录</em></span>
      <button class="ib xs" aria-label="下一页"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn outline xs">今天</button>
    </div>
    <div class="vrow">
      <button class="btn solid">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建
      </button>
      <button class="btn quiet">08–22</button>
      <button class="ib" aria-label="宽屏模式" style="margin-left:auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 3H6a3 3 0 0 0-3 3v2M16 3h2a3 3 0 0 1 3 3v2M8 21H6a3 3 0 0 1-3-3v-2M16 21h2a3 3 0 0 0 3-3v-2"/></svg></button>
    </div>
  </div>

  <main class="tl">
    <div class="track">
      <div class="hour" style="top:0px"><span>08:00</span></div>
      <div class="hour" style="top:64px"><span>09:00</span></div>
      <div class="hour" style="top:128px"><span>10:00</span></div>
      <div class="hour" style="top:192px"><span>11:00</span></div>
      <div class="hour" style="top:256px"><span>12:00</span></div>
      <div class="hour" style="top:320px"><span>13:00</span></div>
      <div class="hour" style="top:384px"><span>14:00</span></div>
      <div class="hour" style="top:448px"><span>15:00</span></div>
      <div class="hour" style="top:512px"><span>16:00</span></div>
      <div class="hour" style="top:576px"><span>17:00</span></div>
      <div class="hour" style="top:640px"><span>18:00</span></div>
      <div class="hour" style="top:704px"><span>19:00</span></div>

      <article class="card taped" style="top:70px;height:92px">
        <div class="ttl">闭环脚本</div>
        <div class="meta"><span>09:00–10:30</span><span class="dot">·</span><span>dev-loop</span></div>
        <div class="note">验证扩展在真实数据下的渲染与断言</div>
      </article>

      <article class="card c-purple" style="top:172px;height:96px">
        <div class="ttl">灵感产品感：把打卡和日历合并成一条时间线</div>
        <div class="meta"><span>10:30–12:00</span><span class="dot">·</span><span>产品</span></div>
        <div class="note">一个视图看完全天，减少抽屉层级</div>
      </article>

      <article class="card c-blue" style="top:392px;height:76px">
        <div class="ttl">卡片编辑器 Notion 化</div>
        <div class="meta"><span>14:00–15:00</span><span class="dot">·</span><span>界面</span></div>
        <div class="note">属性行两列网格 + 原子组件复用</div>
      </article>

      <div class="now" style="top:571px"><span class="pill">现在 16:55</span></div>
    </div>
  </main>

  <nav class="dock" aria-label="视图切换">
    <button class="on" aria-pressed="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h13M4 12h16M4 17h8"/></svg><span>日程</span>
    </button>
    <button aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>周视图</span>
    </button>
    <button aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h.01M12 14h.01M17 14h.01"/></svg><span>月视图</span>
    </button>
  </nav>
</div>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
</body>
</html>
