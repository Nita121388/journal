<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 背景圆角方：成长绿 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#5BB974"/>

  <!-- 日历：暖白纸面 + 深绿顶部栏 + 装订环 + 记录短线 -->
  <g>
    <!-- 纸面（暖白） -->
    <rect x="24" y="36" width="80" height="62" rx="11" fill="#FEFBF1"/>
    <!-- 顶部绿色栏（上圆角） -->
    <path d="M35,47 h58 a11,11 0 0 1 0,0 z" fill="none"/>
    <path d="M24,47 a11,11 0 0 1 11,-11 h58 a11,11 0 0 1 11,11 v14 h-80 z" fill="#3E9A5F"/>
    <!-- 装订环 x2（白色，骑跨顶部栏上沿） -->
    <rect x="42" y="30" width="9" height="11" rx="4" fill="#FFFFFF"/>
    <rect x="77" y="30" width="9" height="11" rx="4" fill="#FFFFFF"/>
    <!-- 记录短线（低饱和绿灰） -->
    <rect x="40" y="72" width="44" height="5" rx="2.5" fill="#A9C6B1"/>
    <rect x="40" y="82" width="32" height="5" rx="2.5" fill="#A9C6B1"/>
    <rect x="40" y="92" width="38" height="5" rx="2.5" fill="#A9C6B1"/>
  </g>

  <!-- 笔：斜跨右下，-35°，覆盖纸面右下角 -->
  <g transform="rotate(-35 82 84)">
    <!-- 笔尖三角（深墨绿） -->
    <path d="M56,76 L40,84 L56,92 Z" fill="#2F6B4A"/>
    <!-- 笔身 -->
    <rect x="56" y="76" width="50" height="16" rx="8" fill="#2F6B4A"/>
    <!-- 金属箍 -->
    <rect x="106" y="76" width="7" height="16" rx="1.5" fill="#D9BC8E"/>
    <!-- 橡皮尾（低饱和珊瑚，唯一暖色点缀） -->
    <rect x="113" y="76" width="13" height="16" rx="4" fill="#E8A08A"/>
  </g>
</svg>
