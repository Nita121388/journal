<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal</title>
  <link rel="stylesheet" href="dist/sidepanel.css">
  <link rel="stylesheet" href="select.css">
  <!-- tokens 必须紧贴 sidepanel.css 之前：dist/sidepanel.css 内含
       :root{--color-X:var(--color-X)} 自引用（Tailwind 生成），需由 tokens 覆盖，
       否则自定义属性成环失效 → 所有 var() 背景变透明。详见 styles/README.md。 -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- 离线持久横幅：host 是本机权威数据源，离线时改动无法保存。
       用持久横幅而非瞬时 toast —— 用户可能几分钟后才继续操作。 -->
  <div id="host-banner" class="host-banner hidden" role="status" aria-live="polite">
    <span class="host-banner-text">本机服务未连接，改动不会保存</span>
    <button id="host-banner-start" class="host-banner-btn" type="button">启动服务</button>
  </div>

  <header id="header">
    <div id="header-left">
      <span id="app-title"><span class="brand-mark" aria-hidden="true">J</span>Journal</span>
      <small id="app-version" class="app-version" hidden></small>
      <time id="today-display"></time>
    </div>
    <div id="header-right">
      <button id="btn-panels" class="hdr-btn ghost" data-icon="menu" aria-label="打开面板"
              title="面板（卡片池/日历/打卡）" aria-expanded="false" aria-controls="sidebar"></button>
      <button id="btn-host-status" class="hdr-btn host-status-btn is-unknown" data-icon="status"
              aria-label="Host 状态：检测中" title="Host 状态：检测中"></button>
      <button id="btn-settings" class="hdr-btn ghost" data-icon="settings" aria-label="设置" title="设置"></button>
    </div>
  </header>

  <main>
    <div id="board">
      <!-- 左侧栏 -->
      <aside id="sidebar">
      <!-- 统一卡片池（唯一主视图：文本/待办都是卡片，待办只是状态筛选） -->
        <section id="cardpool-section">
          <div class="section-header">
            <span class="section-label"><i data-icon="layout" data-icon-size="14"></i>卡片池</span>
            <span id="cardpool-count" class="section-badge">0</span>
            <button id="btn-pool-layout" class="pool-tool-btn" data-icon="grid" data-icon-size="14"
                    aria-label="切换布局（卡片/列表）" title="切换布局（卡片/列表）"></button>
            <button id="btn-save-view" class="pool-tool-btn" data-icon="save" data-icon-size="14"
                    aria-label="保存当前为命名视图" title="保存当前为命名视图"></button>
            <select id="pool-view-select" class="pool-view-select" aria-label="命名视图">
              <option value="">全部卡片</option>
            </select>
          </div>
          <div id="pool-filter-row" class="pool-filter-row">
            <!-- 状态筛选：由 JS 渲染 -->
          </div>
          <input id="pool-search" type="search" class="pool-search"
                 placeholder="搜索标题 / 内容 / 标签…" aria-label="搜索卡片" autocomplete="off" />
          <button id="pool-extra-filter" class="pool-extra-filter" aria-expanded="false" aria-controls="pool-extra"><i data-icon="filter" data-icon-size="14"></i><span>项目/标签筛选</span></button>
          <div id="pool-extra" class="pool-extra"></div>
          <ul id="cardpool-list"></ul>
          <div class="cardpool-actions">
            <button id="btn-template" class="cardpool-add-btn" title="用模板新建"><i data-icon="template" data-icon-size="14"></i><span>模板</span></button>
            <button id="btn-new-card" class="cardpool-add-btn"><i data-icon="plus" data-icon-size="14"></i><span>新卡片</span></button>
          </div>
        </section>

        <!-- 日历 -->
        <section id="calendar-section">
          <label class="section-label"><i data-icon="calendar" data-icon-size="14"></i>日历</label>
          <div class="calendar-header">
            <button id="cal-prev" class="cal-nav-btn" aria-label="上一月">‹</button>
            <span id="cal-month-label" class="cal-month-label"></span>
            <button id="cal-next" class="cal-nav-btn" aria-label="下一月">›</button>
            <button id="cal-today" class="cal-today-btn" title="回到今天">今天</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="日历"></div>
        </section>

        <!-- 热力图 -->
        <section id="heatmap-section">
          <div class="section-header">
            <span class="section-label"><i data-icon="flame" data-icon-size="14"></i>打卡</span>
            <span id="heatmap-streak" class="section-badge"></span>
          </div>
          <div id="heatmap-container" role="img" aria-label="日志热力图"></div>
        </section>

        <!-- 本机 Skills（快速复制给 AI） -->
        <section id="skills-section">
          <div class="section-header">
            <span class="section-label"><i data-icon="sparkle" data-icon-size="14"></i>AI Skill 状态</span>
            <span id="skills-count" class="section-badge">…</span>
            <button id="btn-skills-toggle" class="skills-toggle-btn" data-icon="chevronDown" data-icon-size="14"
                    aria-label="展开/收起" title="展开/收起"></button>
          </div>
          <div id="skills-panel" class="skills-panel hidden">
            <div id="skills-overall" class="skills-overall"></div>
            <ul id="skills-list" class="skills-list"></ul>
            <button id="btn-skills-copy" class="skills-copyall-btn"><i data-icon="copy" data-icon-size="14"></i><span>复制所有路径给 AI</span></button>
          </div>
        </section>
      </aside>

      <!-- 右侧：日历/周历/时间线 -->
      <section id="timeline-section">
        <div class="view-header">
          <div class="view-row view-row--nav">
            <button id="view-prev" class="hdr-btn ghost xs" data-icon="chevronLeft" aria-label="上一页"></button>
            <span id="timeline-date-header"></span>
            <button id="view-next" class="hdr-btn ghost xs" data-icon="chevronRight" aria-label="下一页"></button>
            <button id="view-today" class="cal-today-btn" title="回到今天">今天</button>
          </div>
          <div class="view-row view-row--tools">
            <button id="btn-quick-add" class="view-wide-btn" data-icon="plus" aria-label="在今天新建卡片"><span>新建</span></button>
            <button id="btn-span" class="view-span-btn" title="切换时间线范围（08-22 / 24 小时）">08–22</button>
            <button id="btn-wide-mode" class="hdr-btn ghost" data-icon="expand" aria-label="宽屏模式"
                    title="宽屏模式（循环：自动 / 强制宽屏 / 强制窄屏）"></button>
          </div>
        </div>
        <div id="timeline-container">
          <!-- 时间线/月历/周历 动态渲染 -->
        </div>
        <!-- 底部视图切换 dock：**唯一**的视图切换入口（data-mode 只由它驱动）
             图标走内联 SVG 而非 emoji：design-system §5「禁止把 emoji 用于视图切换等功能入口」 -->
        <nav id="view-dock" class="view-dock" aria-label="视图切换">
          <button type="button" class="view-dock-btn" data-mode="timeline" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 6h10M4 12h16M4 18h7" />
            </svg>
            <span>日程</span>
          </button>
          <button type="button" class="view-dock-btn" data-mode="week" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M3 10h18M8 3v4M16 3v4M9 14h2M13 14h2" />
            </svg>
            <span>周视图</span>
          </button>
          <button type="button" class="view-dock-btn" data-mode="month" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M3 10h18M8 3v4M16 3v4" />
              <path d="M7 14h.01M12 14h.01M17 14h.01M7 18h.01M12 18h.01M17 18h.01" />
            </svg>
            <span>月视图</span>
          </button>
        </nav>
      </section>
    </div>
  </main>

  <!-- 操作提示 toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- 应用内对话框（替代原生 alert/confirm/prompt） -->
  <div id="app-dialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="app-dialog-title">
    <div class="app-dialog">
      <div class="app-dialog-header">
        <span id="app-dialog-title" class="app-dialog-title"></span>
        <button id="app-dialog-close" class="card-editor-close-btn" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="app-dialog-body" class="app-dialog-body"></div>
      <div id="app-dialog-actions" class="app-dialog-actions"></div>
    </div>
  </div>
  <!-- 模板构建器弹窗 -->
  <div id="template-builder-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="模板构建器">
    <div class="template-builder">
      <div class="tpl-builder-header">
        <div class="ce-tile-wrap">
          <button id="tpl-builder-tile" type="button" class="ce-emoji-tile" title="模板默认图标"><span id="tpl-builder-emoji" class="emoji-preview">🗂️</span></button>
          <div id="tpl-builder-picker" class="emoji-picker hidden"></div>
        </div>
        <div class="tpl-builder-head">
          <input id="tpl-builder-name" type="text" class="card-editor-title" placeholder="模板名称…" aria-label="模板名称" autocomplete="off" />
        </div>
        <button id="tpl-builder-close" class="card-editor-close-btn" aria-label="关闭">✕</button>
      </div>
      <div class="tpl-builder-body">
        <div id="tpl-prop-list" class="tpl-prop-list"></div>
        <div class="tpl-builder-foot">
          <button id="tpl-prefill" class="btn-secondary" type="button" title="以当前卡片为蓝本，自动勾选并填入已有值">从当前卡预填</button>
          <span class="tpl-builder-spacer"></span>
          <button id="tpl-cancel" class="btn-secondary" type="button">取消</button>
          <button id="tpl-save" class="btn-primary" type="button">保存模板</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 卡片编辑弹窗 -->
  <div id="card-editor-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="卡片编辑器">
    <div class="card-editor">
      <div class="card-editor-header">
        <div class="ce-tile-wrap">
          <button id="btn-emoji-tile" type="button" class="ce-emoji-tile" title="点选图标">
            <span id="emoji-preview" class="emoji-preview" title="卡片图标">📝</span>
          </button>
          <div id="emoji-picker" class="emoji-picker hidden"></div>
        </div>
        <div class="ce-head-fields">
          <input id="card-editor-title" type="text" class="card-editor-title" placeholder="标题…" aria-label="标题" autocomplete="off" />
          <div class="ce-head-subrow">
            <select id="card-editor-type" aria-label="类型">
              <option value="text">📝 文本</option>
              <option value="task">☑️ 任务</option>
              <option value="idea">💡 想法</option>
            </select>
            <button id="card-editor-template" type="button" class="ce-template-btn" title="切换模板" aria-haspopup="menu">
              <i data-icon="template" data-icon-size="12" aria-hidden="true"></i>
              <span id="card-editor-template-name" class="ce-template-name">空白</span>
            </button>
          </div>
        </div>
        <button id="card-editor-close" class="card-editor-close-btn" aria-label="关闭">✕</button>
      </div>

      <div class="card-editor-body">
        <!-- 属性区：Notion 式两列网格（左键右值），行结构由 components/property-row.js 定义 -->
        <div class="ce-props" id="card-editor-props">
          <input type="hidden" id="card-editor-status" value="none" />
          <input type="hidden" id="card-editor-priority" value="medium" />

          <div class="prop-row" data-key="status" data-field="status">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">⚙️</span><span class="prop-key-label">状态</span></div>
            <div class="prop-val prop-val--stack">
              <div class="status-seg" id="card-editor-status-seg" role="radiogroup" aria-label="状态">
                <button type="button" class="seg is-active" role="radio" aria-checked="true" data-status="none">📝 纯记录</button>
                <button type="button" class="seg" role="radio" aria-checked="false" data-status="todo">📌 未开始</button>
                <button type="button" class="seg" role="radio" aria-checked="false" data-status="doing">🔥 进行中</button>
                <button type="button" class="seg" role="radio" aria-checked="false" data-status="done">✅ 已完成</button>
              </div>
              <input id="card-editor-status-custom" type="text" maxlength="20" placeholder="自定义状态，如：等待反馈" aria-label="自定义状态" autocomplete="off" />
            </div>
          </div>

          <div class="prop-row" data-key="progress" data-field="progress">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">📊</span><span class="prop-key-label">进度</span></div>
            <div class="prop-val">
              <input type="range" id="card-editor-progress" min="0" max="100" step="5" aria-label="进度" />
              <input type="number" id="card-editor-progress-number" min="0" max="100" class="ce-progress-number" aria-label="进度数值" />
              <span class="ce-progress-percent">%</span>
            </div>
          </div>

          <div class="prop-row" data-key="priority" data-field="priority">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">🚩</span><span class="prop-key-label">优先级</span></div>
            <div class="prop-val">
              <div class="prio-seg" id="card-editor-priority-seg" role="radiogroup" aria-label="优先级">
                <button type="button" class="seg" role="radio" aria-checked="false" data-priority="high" title="高优先级"><i class="seg-dot" aria-hidden="true"></i>高</button>
                <button type="button" class="seg is-active" role="radio" aria-checked="true" data-priority="medium" title="中优先级"><i class="seg-dot" aria-hidden="true"></i>中</button>
                <button type="button" class="seg" role="radio" aria-checked="false" data-priority="low" title="低优先级"><i class="seg-dot" aria-hidden="true"></i>低</button>
              </div>
            </div>
          </div>

          <div class="prop-row" data-key="date" data-field="assignedDate">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">📅</span><span class="prop-key-label">日期</span></div>
            <div class="prop-val">
              <input type="date" id="card-editor-date" class="card-editor-date" aria-label="日期" />
            </div>
          </div>

          <div class="prop-row" data-key="schedule" data-field="schedule">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">⏱️</span><span class="prop-key-label">排程</span></div>
            <div class="prop-val card-editor-times">
              <label class="ce-time-field"><span>开始</span><input type="time" id="card-editor-start" step="900" /></label>
              <label class="ce-time-field"><span>结束</span><input type="time" id="card-editor-end" step="900" /></label>
              <label class="ce-time-field ce-time-field--wide"><span>时长(分)</span><input type="number" id="card-editor-duration-min" min="0" class="card-editor-duration-input" /></label>
              <span id="card-editor-duration" class="card-editor-duration"></span>
            </div>
          </div>

          <div class="prop-row" data-key="tags" data-field="tags">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">#</span><span class="prop-key-label">标签</span></div>
            <div class="prop-val prop-val--wrap">
              <div id="card-editor-tag-chips" class="tag-chips"></div>
              <input id="card-editor-tag-input" type="text" placeholder="+ 添加标签" aria-label="标签" />
            </div>
          </div>

          <div class="prop-row" data-key="project" data-field="project">
            <div class="prop-key"><span class="prop-key-icon" aria-hidden="true">📁</span><span class="prop-key-label">项目</span></div>
            <div class="prop-val">
              <input id="card-editor-project" type="text" list="project-suggest" placeholder="E:/primary/projects/journal" aria-label="项目目录" />
              <datalist id="project-suggest"></datalist>
              <div id="card-editor-meta" class="card-editor-meta"></div>
            </div>
          </div>
        </div>

        <hr class="prop-divider" />

        <!-- 正文：Notion 里正文在属性区之下，不再套卡片 -->
        <textarea id="card-editor-content" placeholder="写下你的想法…" rows="4" aria-label="内容"></textarea>

        <!-- 更多：自定义属性 -->
        <details class="ce-more">
          <summary>自定义属性</summary>
          <div class="card-editor-props">
            <div class="props-header">
              <span class="section-label">属性（自定义）</span>
              <button id="btn-add-prop" type="button" class="props-add-btn" title="新增自定义属性">＋ 添加属性</button>
              <button id="btn-prop-lib" type="button" class="props-add-btn" title="从属性库复用">🗂️ 属性库</button>
            </div>
            <div id="card-editor-props-list" class="props-list"></div>
            <div id="prop-form" class="prop-form hidden">
              <div class="prop-form-row">
                <label class="prop-field">名称 <input id="prop-key" type="text" placeholder="client" aria-label="属性名" /></label>
                <label class="prop-field">图标 <input id="prop-icon" type="text" maxlength="8" placeholder="🧑" aria-label="图标" /></label>
              </div>
              <div class="prop-form-row">
                <label class="prop-field">类型
                  <select id="prop-type" aria-label="属性类型">
                    <option value="text">文本</option>
                    <option value="number">数字</option>
                    <option value="select">选择</option>
                    <option value="multi">多选</option>
                    <option value="date">日期</option>
                    <option value="time">时间</option>
                    <option value="checkbox">勾选</option>
                  </select>
                </label>
                <label class="prop-options-wrap hidden">选项(,分隔) <input id="prop-options" type="text" placeholder="A,B,C" aria-label="选项" /></label>
              </div>
              <div class="prop-form-actions">
                <button id="prop-form-ok" type="button" class="btn-primary">添加</button>
                <button id="prop-form-cancel" type="button" class="btn-secondary">取消</button>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div class="card-editor-footer">
        <button id="card-editor-save-template" type="button" class="btn-secondary btn-quiet" title="把当前卡片保存为命名模板">🗂️ 保存为模板</button>
        <span class="card-editor-footer-spacer"></span>
        <button id="card-editor-cancel" class="btn-secondary">取消</button>
        <button id="card-editor-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 属性定义编辑弹窗（新建 / 编辑属性，高于模板构建器） -->
  <div id="tpl-prop-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="编辑属性定义">
    <div class="card-editor tpl-prop-dialog">
      <div class="card-editor-header">
        <div class="card-editor-title" id="tpl-prop-dialog-title">新建属性</div>
        <button id="tpl-prop-close" class="card-editor-close-btn" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="card-editor-body">
        <div id="tpl-newprop-form" class="prop-form">
          <div class="prop-form-row">
            <label class="prop-field">显示名 <input id="tpl-np-label" type="text" maxlength="12" placeholder="如：重要度" aria-label="显示名" /></label>
            <label class="prop-field">图标
              <span class="prop-icon-pick">
                <button type="button" id="tpl-np-icon-tile" class="ce-emoji-tile" title="点选图标" aria-label="点选图标"><span id="tpl-np-icon-preview" class="emoji-preview">•</span></button>
                <input id="tpl-np-icon" type="hidden" />
                <span id="tpl-np-icon-picker-wrap" class="ce-tile-wrap">
                  <span id="tpl-np-icon-picker" class="emoji-picker hidden"></span>
                </span>
              </span>
            </label>
          </div>
          <div class="prop-form-row">
            <label class="prop-field">类型
              <select id="tpl-np-type" aria-label="属性类型">
                <option value="text">文本</option>
                <option value="number">数字</option>
                <option value="select">选择</option>
                <option value="multi">多选</option>
                <option value="date">日期</option>
                <option value="time">时间</option>
                <option value="checkbox">勾选</option>
              </select>
            </label>
          </div>
          <div class="prop-form-row">
            <label class="prop-field">属性键 <input id="tpl-np-key" type="text" placeholder="priority" aria-label="属性键" /></label>
          </div>
          <div class="prop-form-row">
            <label class="prop-field prop-options-wrap hidden">选项(,分隔) <input id="tpl-np-options" type="text" placeholder="A,B,C" aria-label="选项" /></label>
          </div>
          <div class="prop-form-actions">
            <button id="tpl-np-ok" class="btn-primary" type="button">加入模板</button>
            <button id="tpl-np-cancel" class="btn-secondary" type="button">取消</button>
          </div>
        </div>
