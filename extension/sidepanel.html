<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="header">
    <div id="header-left">
      <span id="app-title">📓 Journal</span>
      <time id="today-display"></time>
    </div>
    <button id="btn-settings" aria-label="设置" title="设置">⚙️</button>
  </header>

  <section id="host-banner" class="host-banner hidden" role="status">
    <span id="host-banner-text">Host 未连接</span>
    <button id="btn-start-host" type="button">启动 Host</button>
  </section>

  <main>
    <div id="board">
      <!-- 左侧栏 -->
      <aside id="sidebar">
      <!-- 统一卡片池（唯一主视图：文本/待办都是卡片，待办只是状态筛选） -->
        <section id="cardpool-section">
          <div class="section-header">
            <span class="section-label">🃏 卡片池</span>
            <span id="cardpool-count" class="section-badge">0</span>
            <button id="btn-pool-layout" class="pool-tool-btn" title="切换布局（卡片/列表）">⊞</button>
            <button id="btn-save-view" class="pool-tool-btn" title="保存当前为命名视图">💾</button>
            <select id="pool-view-select" class="pool-view-select" aria-label="命名视图">
              <option value="">全部卡片</option>
            </select>
          </div>
          <div id="pool-filter-row" class="pool-filter-row">
            <!-- 状态筛选 + 布局 + 项目：由 JS 渲染 -->
          </div>
          <ul id="cardpool-list"></ul>
          <div class="cardpool-actions">
            <button id="btn-template" class="cardpool-add-btn" title="用模板新建">🗂 模板</button>
            <button id="btn-new-card" class="cardpool-add-btn">＋ 新卡片</button>
          </div>
        </section>

        <!-- 日历 -->
        <section id="calendar-section">
          <label class="section-label">📅 日历</label>
          <div class="calendar-header">
            <button id="cal-prev" class="cal-nav-btn" aria-label="上一月">‹</button>
            <span id="cal-month-label" class="cal-month-label"></span>
            <button id="cal-next" class="cal-nav-btn" aria-label="下一月">›</button>
            <button id="cal-today" class="cal-today-btn" title="回到今天">今天</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="日历"></div>
        </section>

        <!-- 热力图 -->
        <section id="heatmap-section">
          <div class="section-header">
            <span class="section-label">🔥 打卡</span>
            <span id="heatmap-streak" class="section-badge"></span>
          </div>
          <div id="heatmap-container" role="img" aria-label="日志热力图"></div>
        </section>

        <!-- 本机 Skills（快速复制给 AI） -->
        <section id="skills-section">
          <div class="section-header">
            <span class="section-label">🧠 AI Skill 状态</span>
            <span id="skills-count" class="section-badge">…</span>
            <button id="btn-skills-toggle" class="skills-toggle-btn" aria-label="展开/收起" title="展开/收起">▾</button>
          </div>
          <div id="skills-panel" class="skills-panel hidden">
            <div id="skills-overall" class="skills-overall"></div>
            <ul id="skills-list" class="skills-list"></ul>
            <button id="btn-skills-copy" class="skills-copyall-btn">📋 复制所有路径给 AI</button>
          </div>
        </section>
      </aside>

      <!-- 右侧：日历/周历/时间线 -->
      <section id="timeline-section">
        <div class="view-header">
          <div class="view-nav">
            <button id="view-prev" class="cal-nav-btn" aria-label="上一页">‹</button>
            <span id="timeline-date-header"></span>
            <button id="view-next" class="cal-nav-btn" aria-label="下一页">›</button>
            <button id="view-today" class="cal-today-btn" title="回到今天">今天</button>
          </div>
          <div class="view-tools">
            <button id="btn-wide-mode" class="view-wide-btn" title="宽屏模式（循环：自动 / 强制宽屏 / 强制窄屏）">⛶</button>
            <button id="btn-span" class="view-span-btn" title="切换时间线范围（08-22 / 24 小时）">08–22</button>
            <div class="view-modes">
              <button id="view-mode-month" class="view-mode-btn" data-mode="month" title="月历">📅</button>
              <button id="view-mode-week" class="view-mode-btn" data-mode="week" title="周历">📆</button>
              <button id="view-mode-timeline" class="view-mode-btn" data-mode="timeline" title="日程">⏱</button>
            </div>
          </div>
        </div>
        <div id="timeline-container">
          <!-- 时间线/月历/周历 动态渲染 -->
        </div>
      </section>
    </div>
  </main>

  <!-- 操作提示 toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- 模板构建器弹窗 -->
  <div id="template-builder-overlay" class="overlay hidden">
    <div class="template-builder">
      <div class="card-editor-accent"></div>
      <div class="tpl-builder-header">
        <div class="ce-tile-wrap">
          <button id="tpl-builder-tile" type="button" class="ce-emoji-tile" title="模板默认图标"><span id="tpl-builder-emoji" class="emoji-preview">🗂</span></button>
          <div id="tpl-builder-picker" class="emoji-picker hidden"></div>
        </div>
        <div class="tpl-builder-head">
          <div class="tpl-builder-heading">保存为模板</div>
          <input id="tpl-builder-name" type="text" class="card-editor-title" placeholder="模板名称…" aria-label="模板名称" autocomplete="off" />
        </div>
        <button id="tpl-builder-close" class="card-editor-close-btn" aria-label="关闭">✕</button>
      </div>
      <div class="tpl-builder-body">
        <div class="tpl-builder-hint">▍勾选要加入模板的属性（默认全空 = 空白模板），并可为每个属性设默认值</div>
        <div id="tpl-prop-list" class="tpl-prop-list"></div>
        <button id="tpl-newprop-btn" class="props-add-btn" type="button">＋ 新建属性…</button>
        <div id="tpl-newprop-form" class="prop-form hidden">
          <div class="prop-form-row">
            <label>名称 <input id="tpl-np-key" type="text" placeholder="client" aria-label="属性名" /></label>
            <label>图标 <input id="tpl-np-icon" type="text" maxlength="8" placeholder="🧑" aria-label="图标" /></label>
            <label>类型
              <select id="tpl-np-type" aria-label="属性类型">
                <option value="text">文本</option>
                <option value="number">数字</option>
                <option value="select">选择</option>
                <option value="multi">多选</option>
                <option value="date">日期</option>
                <option value="time">时间</option>
                <option value="checkbox">勾选</option>
              </select>
            </label>
          </div>
          <div class="prop-form-actions">
            <button id="tpl-np-ok" class="btn-primary" type="button">加入模板</button>
            <button id="tpl-np-cancel" class="btn-secondary" type="button">取消</button>
          </div>
        </div>
        <div class="tpl-builder-foot">
          <button id="tpl-prefill" class="btn-secondary" type="button" title="以当前卡片为蓝本，自动勾选并填入已有值">从当前卡预填</button>
          <span class="tpl-builder-spacer"></span>
          <button id="tpl-cancel" class="btn-secondary" type="button">取消</button>
          <button id="tpl-save" class="btn-primary" type="button">保存模板</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 卡片编辑弹窗 -->
  <div id="card-editor-overlay" class="overlay hidden">
    <div class="card-editor">
      <div class="card-editor-accent"></div>

      <div class="card-editor-header">
        <div class="ce-tile-wrap">
          <button id="btn-emoji-tile" type="button" class="ce-emoji-tile" title="点选图标">
            <span id="emoji-preview" class="emoji-preview" title="卡片图标">📝</span>
          </button>
          <div id="emoji-picker" class="emoji-picker hidden"></div>
        </div>
        <div class="ce-head-fields">
          <input id="card-editor-title" type="text" class="card-editor-title" placeholder="标题…" aria-label="标题" autocomplete="off" />
          <div class="ce-head-subrow">
            <input type="date" id="card-editor-date" class="card-editor-date" aria-label="日期" />
            <select id="card-editor-type" aria-label="类型">
              <option value="text">📝 文本</option>
              <option value="task">☑️ 任务</option>
            </select>
          </div>
        </div>
        <button id="card-editor-close" class="card-editor-close-btn" aria-label="关闭">✕</button>
      </div>

      <div class="card-editor-body">
        <!-- 工作流：状态（分段）+ 进度 -->
        <section class="ce-section">
          <div class="ce-section-label">⚙️ 状态</div>
          <input type="hidden" id="card-editor-status" value="none" />
          <div class="status-seg" id="card-editor-status-seg" role="radiogroup" aria-label="状态">
            <button type="button" class="seg is-active" data-status="none">📝 纯记录</button>
            <button type="button" class="seg" data-status="todo">📌 待办</button>
            <button type="button" class="seg" data-status="doing">🔥 进行中</button>
            <button type="button" class="seg" data-status="done">✅ 已完成</button>
          </div>
          <div class="ce-status-custom">
            <span class="ce-status-custom-label">自定义状态</span>
            <input id="card-editor-status-custom" type="text" maxlength="20" placeholder="如：等待反馈" aria-label="自定义状态" autocomplete="off" />
          </div>
          <div class="ce-progress-row">
            <span class="ce-progress-caption">进度</span>
            <input type="range" id="card-editor-progress" min="0" max="100" step="5" aria-label="进度" />
            <input type="number" id="card-editor-progress-number" min="0" max="100" class="ce-progress-number" aria-label="进度数值" />
            <span class="ce-progress-percent">%</span>
          </div>
        </section>

        <!-- 排程：起止 + 时长 -->
        <section class="ce-section">
          <div class="ce-section-label">📅 排程</div>
          <div class="card-editor-times">
            <label>开始 <input type="time" id="card-editor-start" step="900" /></label>
            <label>结束 <input type="time" id="card-editor-end" step="900" /></label>
            <label>时长(分) <input type="number" id="card-editor-duration-min" min="0" class="card-editor-duration-input" /></label>
            <span id="card-editor-duration" class="card-editor-duration"></span>
          </div>
        </section>

        <!-- 内容 -->
        <section class="ce-section">
          <div class="ce-section-label">📝 内容</div>
          <textarea id="card-editor-content" placeholder="写下你的想法…" rows="4"></textarea>
        </section>

        <!-- 标签（图标选择已由头部瓦片负责） -->
        <section class="ce-section">
          <div class="ce-section-label"># 标签</div>
          <div class="card-editor-tags">
            <div id="card-editor-tag-chips" class="tag-chips"></div>
            <input id="card-editor-tag-input" type="text" placeholder="标签，回车添加" aria-label="标签" />
          </div>
        </section>

        <!-- 更多：项目 / 属性 / 模板 -->
        <details class="ce-more">
          <summary>📁 更多属性</summary>
          <div class="card-editor-project">
            <label class="field">项目目录
              <input id="card-editor-project" type="text" list="project-suggest" placeholder="E:/projects/journal" aria-label="项目目录" />
              <datalist id="project-suggest"></datalist>
            </label>
            <div id="card-editor-meta" class="card-editor-meta"></div>
          </div>
          <div class="card-editor-props">
            <div class="props-header">
              <span class="section-label">属性（自定义）</span>
              <button id="btn-add-prop" type="button" class="props-add-btn" title="新增自定义属性">＋ 添加属性</button>
              <button id="btn-prop-lib" type="button" class="props-add-btn" title="从属性库复用">🗂 属性库</button>
            </div>
            <div id="card-editor-props-list" class="props-list"></div>
            <div id="prop-form" class="prop-form hidden">
              <div class="prop-form-row">
                <label>名称 <input id="prop-key" type="text" placeholder="client" aria-label="属性名" /></label>
                <label>图标 <input id="prop-icon" type="text" maxlength="8" placeholder="🧑" aria-label="图标" /></label>
              </div>
              <div class="prop-form-row">
                <label>类型
                  <select id="prop-type" aria-label="属性类型">
                    <option value="text">文本</option>
                    <option value="number">数字</option>
                    <option value="select">选择</option>
                    <option value="multi">多选</option>
                    <option value="date">日期</option>
                    <option value="time">时间</option>
                    <option value="checkbox">勾选</option>
                  </select>
                </label>
                <label class="prop-options-wrap hidden">选项(,分隔) <input id="prop-options" type="text" placeholder="A,B,C" aria-label="选项" /></label>
              </div>
              <div class="prop-form-actions">
                <button id="prop-form-ok" type="button" class="btn-primary">添加</button>
                <button id="prop-form-cancel" type="button" class="btn-secondary">取消</button>
              </div>
            </div>
          </div>
        </details>

        <div class="card-editor-tools">
          <button id="card-editor-save-template" type="button" class="btn-secondary" title="把当前卡片保存为命名模板">🗂 保存为模板</button>
        </div>
      </div>

      <div class="card-editor-footer">
        <button id="card-editor-cancel" class="btn-secondary">取消</button>
        <button id="card-editor-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
