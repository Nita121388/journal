<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="header">
    <div id="header-left">
      <span id="app-title">📓 Journal</span>
      <time id="today-display"></time>
    </div>
    <button id="btn-settings" aria-label="设置" title="设置">⚙️</button>
  </header>

  <main>
    <section id="journal-section">
      <label for="journal-input" class="section-label">今日日志</label>
      <textarea
        id="journal-input"
        placeholder="今天做了什么..."
        rows="12"
        spellcheck="true"
      ></textarea>
      <div id="save-status"></div>
    </section>

    <section id="heatmap-section">
      <label class="section-label">打卡热力图</label>
      <div id="heatmap-container" role="img" aria-label="日志热力图"></div>
    </section>

    <section id="calendar-section">
      <label class="section-label">日历</label>
      <div class="calendar-header">
        <button id="cal-prev" class="cal-nav-btn" aria-label="上一月" title="上一月">‹</button>
        <span id="cal-month-label" class="cal-month-label"></span>
        <button id="cal-next" class="cal-nav-btn" aria-label="下一月" title="下一月">›</button>
        <button id="cal-today" class="cal-today-btn" title="回到本月并编辑今天">今天</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="日历"></div>
    </section>

    <section id="todo-section">
      <div class="todo-header">
        <label class="section-label">待办清单</label>
        <div id="todo-stats"></div>
      </div>

      <div id="todo-input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="添加待办..."
          aria-label="添加待办"
          autocomplete="off"
        />
        <select id="todo-priority" aria-label="优先级" title="优先级">
          <option value="low">🟢 低</option>
          <option value="medium" selected>🟡 中</option>
          <option value="high">🔴 高</option>
        </select>
        <input
          type="date"
          id="todo-due"
          aria-label="截止日期"
          title="截止日期"
        />
      </div>

      <div id="todo-filter-row">
        <button class="todo-filter active" data-filter="active">未完成</button>
        <button class="todo-filter" data-filter="all">全部</button>
        <button class="todo-filter" data-filter="done">已完成</button>
      </div>

      <ul id="todo-list"></ul>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
